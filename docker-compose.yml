services:
  demo:
    build:
      context: .
    image: synapticams-demo
    # AI backend — Ollama (local) takes priority over Anthropic API.
    # Make sure Ollama is running on the host before starting: `ollama serve`
    # Mac/Windows Docker Desktop: host.docker.internal resolves automatically.
    # WSL2 plain Docker Engine: set OLLAMA_BASE_URL to the WSL2 host IP
    #   (e.g. export OLLAMA_BASE_URL=http://172.x.x.x:11434) before running.
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5-coder:7b}
    # Mount a host directory to persist simulation output across runs
    volumes:
      - ./output:/app/examples/serdes_system_level_demo/serdes_final_model
    # Run once then exit (not a long-running service)
    restart: "no"

  # Optional: run the Streamlit web UI
  ui:
    build:
      context: .
    image: synapticams-demo
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5-coder:7b}
    ports:
      - "8501:8501"
    command: ["streamlit", "run", "demo/app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    restart: unless-stopped
